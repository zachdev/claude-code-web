events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    # ── WebSocket upgrade map ──────────────────────────────────────────────────
    # Passes "upgrade" for WebSocket connections and "" for normal HTTP so that
    # keep-alive connections are not inadvertently closed by a bare "upgrade".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Shared proxy settings ──────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # ── Health check endpoint ──────────────────────────────────────────────────
    server {
        listen 80;

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── Claude Code UI (Claude / Codex / Gemini agents) ─────────────────
        location / {
            proxy_pass http://claudecodeui:3001;
        }

        # ── Vibe Coder ────────────────────────────────────────────────────────
        location /vibe/ {
            proxy_pass http://vibe-coder:17880/;
        }
    }
}
